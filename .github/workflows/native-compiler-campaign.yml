name: Native compiler campaign
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'hosts/**'
      - 'scripts/**'
      - 'specs/**'
      - 'tests/**'
      - '.github/workflows/native-compiler-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'src'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native compiler and local fixture dependencies
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/native-dependencies.log"
          timeout --kill-after=10s 300s sudo apt-get install -y gcc clang binutils pkg-config zlib1g-dev libssl-dev libsqlite3-dev libxml2-dev libjson-c-dev libpng-dev 2>&1 | tee -a "$RUNNER_TEMP/native-dependencies.log"
      - name: Check regression tests against actual ELF tools
        run: |
          set -euo pipefail
          ulimit -v 2097152
          timeout --kill-after=10s 300s python -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
      - name: Record the execution environment
        run: |
          python -c "import json,platform,subprocess,sys; names=['gcc','clang','objcopy','nm','strip','readelf']; print(json.dumps({'python':sys.version,'platform':platform.platform(),'tools':{n:subprocess.check_output([n,'--version'],text=True).splitlines()[0] for n in names}},indent=2))" > "$RUNNER_TEMP/native-environment.json"
      - name: Run both complete gated matrices and derive their comparison
        run: |
          set -euo pipefail
          ulimit -v 2097152
          timeout --kill-after=10s 2700s bash scripts/run_full.sh "$RUNNER_TEMP/native-study" 4 2>&1 | tee "$RUNNER_TEMP/native-campaign.log"
      - name: Preserve measured outputs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-compiler-evidence
          path: |
            ${{ runner.temp }}/native-dependencies.log
            ${{ runner.temp }}/native-tests.log
            ${{ runner.temp }}/native-campaign.log
            ${{ runner.temp }}/native-environment.json
            ${{ runner.temp }}/native-study/
          if-no-files-found: warn
          retention-days: 14
