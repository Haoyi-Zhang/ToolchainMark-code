name: Scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-models-and-retained-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'src:tests'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check owned finite models and rederive retained measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scientific-evidence"
          timeout --kill-after=10s 480s bash <<'CHECKS'
          set -euo pipefail
          ulimit -v 2097152
          ulimit -t 300
          ulimit -f 1048576
          OUT="$RUNNER_TEMP/scientific-evidence"
          python -B --version 2>&1 | tee "$OUT/python.log"
          python -B -m unittest -v test_repair_models test_scientific_repairs test_study_coverage test_evidence_catalog test_external_transfer test_evidence_boundaries.EvidenceBoundaryTests 2>&1 | tee "$OUT/models.log"
          python -B scripts/verify_science.py 2>&1 | tee "$OUT/retained-checks.log"
          python -B -m zipfile -e results/native-linux/evidence.zip "$OUT/native-evidence" 2>&1 | tee "$OUT/archive.log"
          python -B scripts/derive_admission_study.py --matrix "$OUT/native-evidence/native-study/first.csv" --rerun "$OUT/native-evidence/native-study/second.csv" --mutants specs/mutants.json --legacy results/raw/robustness_matrix.csv --out "$OUT/derived" 2>&1 | tee "$OUT/derivation.log"
          for original in "$OUT/native-evidence/native-study/derived/"*; do
            cmp "$original" "$OUT/derived/${original##*/}" 2>&1 | tee -a "$OUT/derived-comparison.log"
          done
          CHECKS
      - name: Preserve raw observations and failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-evidence
          path: ${{ runner.temp }}/scientific-evidence/
          if-no-files-found: warn
          retention-days: 14
